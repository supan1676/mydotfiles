# ~/.config/noctalia/config.toml

# ─────────────────────────────────────────────────────────────
#  Lock Screen Appearance
# ─────────────────────────────────────────────────────────────
[lockscreen]
enabled = true
blur_intensity = 0.5        # Background blur (0.0 - 1.0)
tint_intensity = 0.3        # Dark tint over blur (0.0 - 1.0)
allow_empty_password = false
lock_before_suspend = true

# ─────────────────────────────────────────────────────────────
#  Lock Screen Widgets
# ─────────────────────────────────────────────────────────────
[lockscreen_widgets]
enabled = true
widget_order = [
    "lockscreen-clock@eDP-1",
    "lockscreen-login-box@eDP-1"
]

# ── Clock Widget ─────────────────────────────────────────────
[lockscreen_widgets.widget."lockscreen-clock@eDP-1"]
type = "clock"
output = "eDP-1"
cx = 960.0                  # Center X for 1920x1080
cy = 350.0                  # Upper-middle placement
box_width = 0.0
box_height = 0.0
rotation = 0.0

[lockscreen_widgets.widget."lockscreen-clock@eDP-1".settings]
clock_style = "digital"
# Single-quoted (literal) TOML string: Noctalia must receive a literal \n
# sequence, which its date formatter renders as a line break. A double-quoted
# string would turn \n into a real newline before Noctalia ever sees it.
# Tokens verified against docs.noctalia.dev "Date format tokens":
#   %H hour, %M minute, %A full weekday, %-d day without padding, %b short month
format = '{:%H\n%M\n%A\n%-d %b}' # Two-line time, then weekday + date (no calendar)
color = "primary"
shadow = true
center_text = true

# ── Login Box Widget ─────────────────────────────────────────
[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
type = "login_box"
output = "eDP-1"
cx = 960.0                  # Same Center X
cy = 700.0                  # Lower-middle placement below clock
box_width = 300.0           # Narrow, pill-shaped box
box_height = 48.0
rotation = 0.0

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
layout = "compact"           # Slim password row - the "compact password input" look
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
show_caps_lock = true
show_keyboard_layout = false
show_login_button = true     # Warm-colored submit button as seen in reference
show_session_buttons = false
show_media = false
show_weather = false
show_unlock_hint = true

[shell.screenshot]
directory = "~/Pictures/Screenshots"
